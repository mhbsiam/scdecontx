# conda env create -f environment.yml && conda activate scdecontx
# Installs scdecontx from this checkout alongside the latest scanpy.
name: scdecontx
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=1.21
  - scipy>=1.7
  - pandas>=1.3
  - numba>=0.55
  - anndata>=0.8
  - scanpy
  - leidenalg
  - igraph
  - jupyterlab
  - pip
  - pip:
      - -e .
