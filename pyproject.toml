[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "scdecontx"
version = "1.0.0"
description = "Fast DecontX ambient RNA removal for scverse, with the results of R celda"
readme = "README.md"
keywords = [
  "ambient-RNA",
  "bayesian",
  "bioinformatics",
  "decontamination",
  "RNA-seq",
  "scanpy",
  "scverse",
  "single-cell",
]
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "Md Hasanul Banna Siam" },
]
authors = [
  { name = "Md Hasanul Banna Siam" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "anndata>=0.8",
  "numba>=0.55",
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
]
optional-dependencies.dev = [
  "pre-commit",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  "setuptools",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxext-opengraph",
]
optional-dependencies.test = [
  "coverage>=7.10",
  "pytest",
]
urls."Bug Tracker" = "https://github.com/mhbsiam/scdecontx/issues"
urls.Changelog = "https://github.com/mhbsiam/scdecontx/blob/main/CHANGELOG.md"
urls.Documentation = "https://scdecontx.readthedocs.io/"
urls.Homepage = "https://github.com/mhbsiam/scdecontx"
urls.Source = "https://github.com/mhbsiam/scdecontx"

[tool.hatch.build.targets.wheel]
packages = [ "src/scdecontx" ]

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
features = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "stable" ]
python = [ "3.11", "3.13" ]

[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "pre" ]
python = [ "3.13" ]

[tool.hatch.envs.hatch-test]
features = [ "dev", "test" ]

[tool.hatch.envs.hatch-test.overrides]
matrix.deps.env-vars = [
  { if = [ "pre" ], key = "UV_PRERELEASE", value = "allow" },
]

[tool.ruff]
line-length = 88
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true

lint.select = [
  "B",
  "BLE",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "RUF100",
  "TID",
  "UP",
  "W",
]
lint.ignore = [
  "B008",
  "D100",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D400",
  "D401",
  "E501",
  "E731",
  "E741",
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib",
]
# Tests import their helpers (_data, _oracle) as top-level modules.
pythonpath = [ "tests" ]

[tool.coverage.run]
source = [ "scdecontx" ]
patch = [ "subprocess" ]
omit = [
  "**/test_*.py",
]
